# 用 Docker 在本机运行思源笔记，浏览器访问 http://127.0.0.1:6806
# 笔记存储目录由 .env 中的 SIYUAN_WORKSPACE 决定，可以是本机任意目录
# 首次使用：cp .env.example .env，修改其中的配置后执行 docker compose up -d
services:
  siyuan:
    image: b3log/siyuan:v3.8.6
    command: ["serve", "--workspace=/siyuan/workspace/", "--accessAuthCode=${SIYUAN_ACCESS_AUTH_CODE:?请在 .env 中设置 SIYUAN_ACCESS_AUTH_CODE}"]
    ports:
      # 只监听本机，不对局域网开放
      - "127.0.0.1:${SIYUAN_PORT:-6806}:6806"
    volumes:
      - ${SIYUAN_WORKSPACE:-./workspace}:/siyuan/workspace
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - SIYUAN_LANG=zh-CN
    restart: unless-stopped
